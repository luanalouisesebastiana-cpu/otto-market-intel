name: otto-scan
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan market + build public data
        run: node scan-publish.mjs
      - name: Commit + push live data
        run: |
          git config user.name "Otto Bot"
          git config user.email "otto@kovantu.digital"
          git add data/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "scan: update live market data"
          git push