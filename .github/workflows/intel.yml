name: Refresh Market Intel
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate intel data
        run: node scripts/ci-refresh.mjs
      - name: Generate dated report (once per day)
        run: |
          node scripts/report.mjs
          node scripts/reports-index.mjs
          node scripts/rss.mjs
      - name: Commit + push
        run: |
          git config user.name "Otto CI"
          git config user.email "otto@kovantu.digital"
          git add data/ reports/ rss.xml
          git diff --staged --quiet || git commit -m "ci: refresh intel + report $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
