name: Refresh Market Intel
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full pipeline (data -> risk gate -> signals -> journal -> treasury -> audit)
        run: node scripts/pipeline.mjs
      - name: Commit + push
        run: |
          git config user.name "Otto CI"
          git config user.email "otto@kovantu.digital"
          git add data/ reports/ rss.xml
          git diff --staged --quiet || git commit -m "ci: pipeline refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
