<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Otto — Lançar Swap Solana (Jupiter)</title>
<style>
:root{--bg:#0b1020;--card:#121a2e;--txt:#e6edf7;--mut:#8b9bb4;--acc:#38bdf8;--up:#34d399}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px}
h1{font-size:1.5rem;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px}
.form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.form input{flex:1;min-width:220px;padding:10px 12px;background:#0a0f1c;color:var(--txt);border:1px solid #1e2a44;border-radius:8px;font-family:ui-monospace,monospace;font-size:.85rem}
.form select{padding:10px;background:#0a0f1c;color:var(--txt);border:1px solid #1e2a44;border-radius:8px}
button{padding:11px 20px;background:var(--acc);color:#04121f;border:0;border-radius:8px;font-weight:600;cursor:pointer}
.info{background:var(--card);border:1px solid #1e2a44;border-radius:10px;padding:14px;margin:12px 0;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-block;padding:12px 18px;border-radius:9px;font-weight:700;text-decoration:none;color:#04121f;background:var(--acc)}
.btn.alt{background:var(--up)}
.note{color:var(--mut);font-size:.82rem;margin-top:16px}
.cta{background:#0e1626;border:1px solid #134e4a;border-radius:10px;padding:14px 18px;margin-top:20px;font-size:.88rem}
.cta a{color:var(--acc)}
footer{color:var(--mut);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<h1>Lançar Swap — Solana</h1>
<p class="sub">Gera um link Jupiter (maior agregador DEX da Solana) para comprar/vender qualquer token. Confira o risco antes.</p>

<div class="form">
  <input id="mint" placeholder="Mint do token (endereço ou símbolo: SOL/USDC/BONK)" spellcheck="false">
  <select id="dir"><option value="buy">Comprar</option><option value="sell">Vender</option></select>
  <input id="amt" placeholder="Quantidade (ex: 1)" style="max-width:140px">
  <button id="go">Gerar link</button>
</div>
<div id="info" class="info" style="display:none"></div>
<div class="row" id="links"></div>

<div class="cta">
<strong>Antes de swappar:</strong> <a href="/token-check.html">verificar risco do token</a> ·
<a href="/route.html">otimizar rota</a> ·
<a href="/dashboard.html">painel ao vivo</a>
</div>
<footer>Otto — Kovantu Digital. Links Jupiter. Não é conselho de investimento.</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const MINTS = {
  'SOL':'So11111111111111111111111111111111111111112',
  'USDC':'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v',
  'USDT':'Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB',
  'BONK':'DezXAZ8774kn8SUk6ryrWVYGyahanyj9iCYKqXnpump',
  'WIF':'EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm'
};
function resolve(v){ v=(v||'').trim(); return MINTS[v.toUpperCase()] || v; }

$('go').onclick = () => {
  const inM = resolve($('mint').value);
  const dir = $('dir').value;
  const amt = ($('amt').value||'1').trim();
  if(!inM){ $('info').style.display='block'; $('info').textContent='Informe o mint do token.'; return; }
  // Jupiter swap link: buy = input SOL, output token; sell = input token, output SOL
  const SOL='So11111111111111111111111111111111111111112';
  let url;
  if(dir==='buy'){
    url = `https://jup.ag/swap/${SOL}-${inM}?inAmount=${encodeURIComponent(amt)}`;
  } else {
    url = `https://jup.ag/swap/${inM}-${SOL}?inAmount=${encodeURIComponent(amt)}`;
  }
  $('info').style.display='block';
  $('info').innerHTML = `Direção: <b>${dir==='buy'?'Comprar':'Vender'}</b> · Token: <code>${inM.slice(0,8)}…${inM.slice(-4)}</code>`;
  $('links').innerHTML = `<a class="btn" href="${url}" target="_blank" rel="noopener">Abrir no Jupiter</a>
    <a class="btn alt" href="https://jup.ag/tokens/${inM}" target="_blank" rel="noopener">Dados do token</a>`;
};
</script>
</body>
</html>
